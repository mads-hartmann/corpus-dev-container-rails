tasks:
  install-dependencies:
    name: Install dependencies
    description: Install gems and prepare the development database.
    command: bin/setup --skip-server
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build assets
    description: Precompile the Rails application assets.
    command: SECRET_KEY_BASE_DUMMY=1 bin/rails assets:precompile
    triggeredBy:
      - manual
    dependsOn:
      - install-dependencies

services:
  rails:
    name: Rails
    description: Run the Rails development server.
    commands:
      start: |
        until bundle check > /dev/null 2>&1; do sleep 1; done
        ona environment port open 3000 --dont-wait --admission creator_only --name "Rails"
        export RAILS_DEVELOPMENT_HOSTS="$(ona environment port get 3000 -f URL | cut -c 9-)"
        exec bin/dev -b 0.0.0.0
      ready: curl -fsS http://localhost:3000
    triggeredBy:
      - manual
      - postEnvironmentStart
