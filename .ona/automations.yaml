tasks:
  installDeps:
    name: Install dependencies
    description: Install gems with Bundler and prepare the SQLite database.
    command: |
      gem install bundler --conservative
      bundle install
      bin/rails db:prepare
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  test:
    name: Test
    description: Run the Rails test suite.
    command: |
      bin/rails test
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  rails:
    name: Rails server
    description: Run the Rails development server.
    commands:
      start: |
        ona environment port open 3000 --dont-wait --admission creator_only --name "rails"
        bin/rails server -b 0.0.0.0 -p 3000
      ready: |
        curl -sf http://localhost:3000 > /dev/null
