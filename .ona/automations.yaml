tasks:
  installDeps:
    name: Install dependencies
    description: Install Ruby gems and prepare the development database.
    command: |
      bundle install
      bin/rails db:prepare
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

services:
  rails:
    name: Rails server
    description: Run the Rails development server.
    commands:
      start: |
        ona environment port open 3000 --admission creator_only --name rails
        bin/rails server -b 0.0.0.0 -p 3000
      ready: |
        curl -sf http://localhost:3000 > /dev/null
