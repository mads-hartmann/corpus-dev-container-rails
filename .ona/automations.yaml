tasks:
  install-dependencies:
    name: Install dependencies
    description: Install gems and prepare the development database.
    command: bin/setup --skip-server
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

services:
  rails:
    name: Rails
    description: Run the Rails development server.
    commands:
      start: |
        ona environment port open 3000 --dont-wait --admission creator_only --name Rails
        until rails_url="$(ona environment port get 3000 -f URL 2>/dev/null)" && [ -n "$rails_url" ]; do
          sleep 1
        done
        export RAILS_DEVELOPMENT_HOSTS="$(printf '%s' "$rails_url" | cut -c 9-)"
        exec bin/rails server --binding 0.0.0.0 --port 3000
      ready: curl --fail --silent http://localhost:3000/up
    triggeredBy:
      - manual
      - postEnvironmentStart
