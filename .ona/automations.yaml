tasks:
  installDeps:
    name: Install dependencies
    description: Install Ruby gems with Bundler.
    command: |
      bundle install
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  prepareDb:
    name: Prepare database
    description: Create, migrate, and seed the SQLite database.
    command: |
      bin/rails db:prepare
    triggeredBy:
      - manual
      - postDevcontainerStart
    dependsOn:
      - installDeps

services:
  rails:
    name: Rails server
    description: Run the Puma development server on port 3000.
    commands:
      start: |
        bin/rails server -b 0.0.0.0 -p 3000
      ready: |
        curl -sf http://localhost:3000 > /dev/null
