tasks:
  install-dependencies:
    name: Install dependencies
    command: bin/setup --skip-server
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

services:
  rails:
    name: Rails
    commands:
      start: |
        ona environment port open 3000 --admission creator_only --name "Rails"
        export ONA_EXPOSED_HOST="$(ona environment port get 3000 -f URL | cut -c 9-)"
        RAILS_DEVELOPMENT_HOSTS="$ONA_EXPOSED_HOST" bin/rails server --binding 0.0.0.0 --port 3000
      ready: |
        export ONA_EXPOSED_HOST="$(ona environment port get 3000 -f URL | cut -c 9-)"
        curl -fsS -H "Host: ${ONA_EXPOSED_HOST}" http://localhost:3000/up
    triggeredBy:
      - manual
      - postEnvironmentStart
