tasks:
  install-dependencies:
    name: Install dependencies
    description: Install Ruby dependencies and prepare the development database
    command: bin/setup --skip-server
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build assets
    description: Precompile the Rails assets
    command: bin/rails assets:precompile
    dependsOn:
      - install-dependencies
    triggeredBy:
      - manual

services:
  rails:
    name: Rails server
    description: Rails development server
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 3000 --admission creator_only --name "Rails server"
        export ONA_EXPOSED_HOST="$(ona environment port get 3000 -f URL | cut -c 9-)"
        RAILS_DEVELOPMENT_HOSTS="$ONA_EXPOSED_HOST" bin/rails server -b 0.0.0.0
      ready: |
        ONA_EXPOSED_HOST="$(ona environment port get 3000 -f URL | cut -c 9-)"
        curl -fsS -H "Host: ${ONA_EXPOSED_HOST}" http://localhost:3000/
