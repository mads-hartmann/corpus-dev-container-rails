tasks:
  install-dependencies:
    name: Install dependencies
    description: Install the Ruby gems pinned by Gemfile.lock.
    command: bundle install
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  test:
    name: Run tests
    description: Run the Rails test suite.
    command: bin/rails test
    dependsOn:
      - install-dependencies
    triggeredBy:
      - manual

services:
  rails:
    name: Rails server
    description: Rails development server.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 3000 --admission creator_only --name "Rails server"
        export ONA_EXPOSED_HOST="$(ona environment port get 3000 -f URL | cut -c 9-)"
        export RAILS_DEVELOPMENT_HOSTS="$ONA_EXPOSED_HOST"
        bin/rails db:prepare
        exec bin/rails server -b 0.0.0.0
      ready: |
        export ONA_EXPOSED_HOST="$(ona environment port get 3000 -f URL | cut -c 9-)"
        curl -fsS -H "Host: ${ONA_EXPOSED_HOST}" http://localhost:3000/up
